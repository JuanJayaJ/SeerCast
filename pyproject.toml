[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seercast"
version = "0.1.0"
description = "Drift-aware multi-horizon retail demand forecasting on the M5 dataset."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.65",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
